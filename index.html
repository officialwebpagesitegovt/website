<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ऑटो फेस डिटेक्शन अटेंडेंस</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .viewport-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin: 16px 0;
      position: relative;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video {
      transform: scaleX(-1);
    }
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 230px;
      border: 2px dashed rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    .scan-guide.detected {
      border-color: #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    #status {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>उपस्थिति सत्यापन</h2>
    <p>चेहरा फ्रेम के बीच में रखें, सिस्टम अपने आप डिटेक्ट करके फोटो ले लेगा।</p>

    <div class="viewport-box">
      <video id="webcam" autoplay playsinline></video>
      <div id="guide" class="scan-guide"></div>
      <img id="snapshot" alt="Captured Frame" style="display: none;">
    </div>

    <canvas id="captureCanvas" style="display: none;"></canvas>

    <div>
      <button id="startBtn">वेरिफिकेशन शुरू करें</button>
      <button id="retakeBtn" style="display: none;">दोबारा स्कैन करें</button>
    </div>

    <div id="status">प्रक्रिया शुरू करने के लिए बटन दबाएं।</div>
  </div>

  <script>
    const webcam = document.getElementById('webcam');
    const guide = document.getElementById('guide');
    const snapshot = document.getElementById('snapshot');
    const canvas = document.getElementById('captureCanvas');
    const startBtn = document.getElementById('startBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const statusText = document.getElementById('status');

    let stream = null;
    let detectionLoop = null;
    let faceDetector = null;
    let isCapturing = false;

    // ब्राउज़र में FaceDetector सपोर्ट चेक करना
    if ('FaceDetector' in window) {
      faceDetector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
    }

    async function initCamera() {
      try {
        statusText.innerText = "कैमरा लोड हो रहा है...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });

        webcam.srcObject = stream;
        webcam.style.display = "block";
        guide.style.display = "block";
        guide.classList.remove('detected');
        snapshot.style.display = "none";
        startBtn.style.display = "none";
        retakeBtn.style.display = "none";
        isCapturing = false;

        statusText.innerText = "चेहरा फ्रेम में लाएं...";
        startDetection();
      } catch (err) {
        statusText.innerText = "कैमरा एक्सेस त्रुटि: कृपया अनुमति की जांच करें।";
      }
    }

    function startDetection() {
      if (!faceDetector) {
        // अगर ब्राउज़र FaceDetector API सपोर्ट न करे तो 3 सेकंड बाद ऑटो-क्लिक
        statusText.innerText = "ऑटो-डिटेक्टर अनुपलब्ध: 3 सेकंड में कैप्चर हो रहा है...";
        setTimeout(capturePhoto, 3000);
        return;
      }

      detectionLoop = setInterval(async () => {
        if (webcam.readyState === 4 && !isCapturing) {
          try {
            const faces = await faceDetector.detect(webcam);
            if (faces.length > 0) {
              guide.classList.add('detected');
              statusText.innerText = "चेहरा डिटेक्ट हुआ! स्थिर रहें...";
              isCapturing = true;
              clearInterval(detectionLoop);
              
              // 600ms का छोटा पॉज ताकि फोटो स्थिर आए
              setTimeout(capturePhoto, 600);
            }
          } catch (e) {
            console.error("डिटेक्शन एरर:", e);
          }
        }
      }, 250);
    }

    function capturePhoto() {
      canvas.width = webcam.videoWidth;
      canvas.height = webcam.videoHeight;
      const ctx = canvas.getContext('2d');

      // सेल्फी मिरर एडजस्टमेंट
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      // कैमरा हार्डवेयर तुरंत बंद करना
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        webcam.srcObject = null;
      }

      const imgUrl = canvas.toDataURL('image/jpeg', 0.85);

      webcam.style.display = "none";
      guide.style.display = "none";
      snapshot.src = imgUrl;
      snapshot.style.display = "block";

      statusText.innerText = "फोटो सफलतापूर्वक कैप्चर हो गई!";
      retakeBtn.style.display = "inline-block";
    }

    startBtn.addEventListener('click', initCamera);
    retakeBtn.addEventListener('click', initCamera);
  </script>
</body>
</html>
