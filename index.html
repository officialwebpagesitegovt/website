<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center font-sans antialiased overflow-hidden">

  <!-- ================= LOADER SCREEN ================= -->
  <div id="loader-screen" class="w-full max-w-md p-6 flex flex-col items-center justify-center transition-opacity duration-700">
    <!-- Animated Badge / Text -->
    <div class="mb-4 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold tracking-widest uppercase animate-pulse">
      <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
      System Initializing
    </div>

    <!-- Percentage Display -->
    <div class="flex items-baseline justify-center mb-6">
      <span id="counter" class="text-7xl md:text-8xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-200 to-indigo-500">
        0
      </span>
      <span class="text-2xl md:text-3xl font-bold text-indigo-400 ml-1">%</span>
    </div>

    <!-- Progress Bar Track -->
    <div class="w-full bg-gray-900 border border-gray-800 rounded-full h-3 p-0.5 shadow-inner overflow-hidden relative">
      <!-- Progress Bar Fill -->
      <div 
        id="progress-bar" 
        class="h-full bg-gradient-to-r from-indigo-600 via-purple-500 to-pink-500 rounded-full w-0 shadow-lg shadow-indigo-500/40"
        style="transition: width 0.1s linear;"
      ></div>
    </div>

    <!-- Timer / Info text -->
    <div class="mt-4 flex justify-between w-full text-xs text-gray-500 font-mono">
      <span>PLEASE WAIT</span>
      <span id="time-left">60s</span>
    </div>
  </div>

  <!-- ================= MAIN CONTENT (Loaded after 1 min) ================= -->
  <div id="main-content" class="hidden opacity-0 transition-opacity duration-1000 flex flex-col items-center text-center p-6 max-w-lg">
    <div class="w-16 h-16 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mb-4 border border-green-500/30">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-white mb-2">Welcome! Site Loaded</h1>
    <p class="text-gray-400 text-sm">लोडिंग पूरी हो चुकी है। अब आप यहाँ अपना मुख्य कंटेंट डाल सकते हैं।</p>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    const counterElement = document.getElementById('counter');
    const progressBar = document.getElementById('progress-bar');
    const timeLeftElement = document.getElementById('time-left');
    const loaderScreen = document.getElementById('loader-screen');
    const mainContent = document.getElementById('main-content');

    const totalDuration = 60 * 1000; // 1 मिनट (60,000 ms)
    const startTime = performance.now();

    function updateLoader(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / totalDuration, 1); // 0 से 1 तक वैल्यू
      
      const percentage = Math.floor(progress * 100);
      const remainingSeconds = Math.max(0, Math.ceil((totalDuration - elapsed) / 1000));

      // UI अपडेट करें
      counterElement.innerText = percentage;
      progressBar.style.width = `${progress * 100}%`;
      timeLeftElement.innerText = `${remainingSeconds}s`;

      if (progress < 1) {
        requestAnimationFrame(updateLoader);
      } else {
        // 100% पूरा होने पर
        counterElement.innerText = 100;
        progressBar.style.width = '100%';
        timeLeftElement.innerText = '0s';

        // स्मूथ ट्रांज़िशन मेन पेज पर
        setTimeout(() => {
          loaderScreen.classList.add('opacity-0');
          setTimeout(() => {
            loaderScreen.classList.add('hidden');
            mainContent.classList.remove('hidden');
            setTimeout(() => {
              mainContent.classList.remove('opacity-0');
            }, 50);
          }, 700);
        }, 300);
      }
    }

    // लोडर शुरू करें
    requestAnimationFrame(updateLoader);
  </script>
</body>
</html>
